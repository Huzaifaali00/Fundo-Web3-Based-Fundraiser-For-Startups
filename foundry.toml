[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@zora-protocol/coins/=lib/zora-protocol/packages/coins/",
    "@zoralabs/coins/=lib/zora-protocol/packages/coins/",        # ← ADD THIS
    "@zoralabs/shared-contracts/=lib/zora-protocol/packages/shared-contracts/src/",
    "forge-std/=lib/forge-std/src/",
    "v4-core/=lib/v4-core/src/",
    "v4-periphery/=lib/v4-periphery/src/",
    "zora-protocol/=lib/zora-protocol/",
    "utils/ReentrancyGuardUpgradeable.sol=lib/openzeppelin-contracts-upgradeable/contracts/security/ReentrancyGuardUpgradeable.sol"
]